<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <style>
    body{margin:0;}
    .screen{
      width:1280px;height:800px;box-sizing:border-box;position:relative;overflow:hidden;
      font-family:'Quicksand',sans-serif;color:#5a4a42;
      background:
        linear-gradient(90deg, rgba(255,182,193,0.16) 50%, transparent 50%),
        linear-gradient(0deg, rgba(255,182,193,0.16) 50%, transparent 50%),
        linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
      background-size: 40px 40px;
      box-shadow: inset 0 0 0 12px #ffb6c1, inset 0 0 0 16px #ffffff;
      display:flex; flex-direction:column;
    }
    .topbar{
      margin:16px 16px 0; height:70px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; box-sizing:border-box;
      background:rgba(255,255,255,0.85); border:3px dashed #ffb6c1; border-radius:24px; flex:none;
    }
    .shop-title{ font-weight:700; font-size:22px; color:#ff69b4; }
    .shop-sub{ font-size:13px; color:#9370db; margin-top:2px; font-weight:600; }
    .gold{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; color:#e05a7a; }
    .main{ flex:1; display:flex; gap:20px; padding:18px 26px 22px; box-sizing:border-box; }
    .preview{
      width:270px; flex:none; background:rgba(255,255,255,0.85);
      border:3px dashed #ffb6c1; border-radius:22px; display:flex; flex-direction:column; align-items:center; padding:16px;
      box-sizing:border-box;
    }
    .preview .cap{ font-weight:700; font-size:15px; margin-bottom:6px; color:#ff69b4; }
    .preview .stage{ width:220px; height:310px; }
    .grid{ flex:1; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 1fr); gap:14px; }
    .cat{
      background:rgba(255,255,255,0.85); border:2px solid #ffd7e2; border-radius:18px; padding:12px 14px; box-sizing:border-box;
      display:flex; flex-direction:column; gap:8px;
    }
    .cat h3{ margin:0; font-size:14.5px; color:#db7093; font-weight:700; display:flex; align-items:center; gap:8px; }
    .item{ display:flex; align-items:center; gap:10px; background:#fff5f8; border-radius:14px; padding:6px 8px; }
    .item .icon{ width:30px; height:30px; flex:none; }
    .item .meta{ flex:1; }
    .item .iname{ font-size:12.5px; font-weight:700; color:#5a4a42; }
    .item .price{ font-size:11px; color:#e05a7a; display:flex; align-items:center; gap:4px; }
    .tag{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; white-space:nowrap; }
    .tag-equipped{ background:#4fb286; color:#f0fff8; }
    .tag-owned{ background:#f0c9d6; color:#8a4a5e; }
    .btn-buy{ font-weight:700; font-size:11px; padding:6px 12px; border-radius:12px; border:none; cursor:pointer;
      background:linear-gradient(180deg,#ffb6c1,#ff69b4); color:#ffffff; }
  </style>
</helmet>
<div class="screen">
  <div class="topbar">
    <div>
      <div class="shop-title">少女衣櫥商店</div>
      <div class="shop-sub">小熊店長說：「歡迎光臨，快來挑一件喜歡的吧！」</div>
    </div>
    <div class="gold">
      <svg width="22" height="22" viewBox="0 0 30 30"><path d="M15 27 C4 19 4 8 12 5 C14.5 4 15 7 15 9 C15 7 15.5 4 18 5 C26 8 26 19 15 27 Z" fill="#ff5c7a"/><circle cx="12" cy="13" r="1.2" fill="#ffe1ea"/><circle cx="17" cy="16" r="1.2" fill="#ffe1ea"/><circle cx="13" cy="19" r="1.2" fill="#ffe1ea"/></svg>
      165
    </div>
  </div>

  <div class="main">
    <div class="preview">
      <div class="cap">目前裝扮</div>
      <div class="stage"><dc-import name="Character" base="girl" state="dressed" mood="happy" hint-size="220,310"></dc-import></div>
    </div>

    <div class="grid">
      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 3 L4 7 L7 10 L9 8 L9 20 L15 20 L15 8 L17 10 L20 7 L16 3 L12 6 Z" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>上衣</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M8 3 L4 7 L7 10 L9 8 L9 20 L15 20 L15 8 L17 10 L20 7 L16 3 L12 6 Z" fill="#ff9eb5"/></svg>
          <div class="meta"><div class="iname">草莓洋裝上身</div><div class="price">20</div></div>
          <div class="tag tag-equipped">已裝備</div>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M8 3 L4 7 L7 10 L9 8 L9 20 L15 20 L15 8 L17 10 L20 7 L16 3 L12 6 Z" fill="#c9a1d8"/></svg>
          <div class="meta"><div class="iname">蕾絲荷葉上衣</div><div class="price">60</div></div>
          <button class="btn-buy">購買</button>
        </div>
      </div>

      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4 L17 4 L20 20 L4 20 Z" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>裙子</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M7 4 L17 4 L20 20 L4 20 Z" fill="#8fbfe0"/></svg>
          <div class="meta"><div class="iname">學院風格裙</div><div class="price">35</div></div>
          <button class="btn-buy">購買</button>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M7 4 L17 4 L20 20 L4 20 Z" fill="#ffb6c1"/></svg>
          <div class="meta"><div class="iname">粉紅蓬蓬裙</div><div class="price">25</div></div>
          <div class="tag tag-owned">已擁有</div>
        </div>
      </div>

      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><rect x="6" y="4" width="5" height="16" rx="2" fill="none" stroke="#db7093" stroke-width="1.6"/><rect x="13" y="4" width="5" height="16" rx="2" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>褲子</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="5" height="16" rx="2" fill="#ff9eb5"/><rect x="13" y="4" width="5" height="16" rx="2" fill="#ff9eb5"/></svg>
          <div class="meta"><div class="iname">粉紅吊帶褲</div><div class="price">20</div></div>
          <div class="tag tag-equipped">已裝備</div>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="5" height="16" rx="2" fill="#ffd93d"/><rect x="13" y="4" width="5" height="16" rx="2" fill="#ffd93d"/></svg>
          <div class="meta"><div class="iname">格紋短褲</div><div class="price">70</div></div>
          <button class="btn-buy">購買</button>
        </div>
      </div>

      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9 C6 5 18 5 18 9 L19 20 L5 20 Z" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>包包</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 9 C6 5 5 15 12 19 C19 15 18 5 12 9 Z" fill="#ff69b4"/></svg>
          <div class="meta"><div class="iname">愛心小背包</div><div class="price">30</div></div>
          <div class="tag tag-equipped">已裝備</div>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 9 C6 5 18 5 18 9 L19 20 L5 20 Z" fill="#fff8f0"/></svg>
          <div class="meta"><div class="iname">兔兔後背包</div><div class="price">80</div></div>
          <button class="btn-buy">購買</button>
        </div>
      </div>

      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 10 Q12 2 20 10" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>飾品</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="7" cy="6" r="3" fill="#ffe1ea"/><circle cx="17" cy="6" r="3" fill="#ffe1ea"/><path d="M6 12 Q12 6 18 12" fill="none" stroke="#5a4a42" stroke-width="1.4"/></svg>
          <div class="meta"><div class="iname">貓耳髮箍</div><div class="price">40</div></div>
          <div class="tag tag-equipped">已裝備</div>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4 l2 5.6 5.6 0.8 -4 4 0.8 5.6 -4.4-2.9 -4.4 2.9 0.8-5.6 -4-4 5.6-0.8 Z" fill="#ffd93d"/></svg>
          <div class="meta"><div class="iname">星星髮夾</div><div class="price">55</div></div>
          <button class="btn-buy">購買</button>
        </div>
      </div>

      <div class="cat">
        <h3><svg width="18" height="18" viewBox="0 0 24 24"><ellipse cx="8" cy="19" rx="5" ry="3" fill="none" stroke="#db7093" stroke-width="1.6"/><ellipse cx="16" cy="19" rx="5" ry="3" fill="none" stroke="#db7093" stroke-width="1.6"/></svg>鞋子</h3>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><ellipse cx="8" cy="19" rx="5" ry="3" fill="#ff69b4"/><ellipse cx="16" cy="19" rx="5" ry="3" fill="#ff69b4"/></svg>
          <div class="meta"><div class="iname">瑪莉珍鞋</div><div class="price">25</div></div>
          <div class="tag tag-equipped">已裝備</div>
        </div>
        <div class="item">
          <svg class="icon" viewBox="0 0 24 24"><ellipse cx="8" cy="19" rx="5" ry="3" fill="#fff8f0"/><ellipse cx="16" cy="19" rx="5" ry="3" fill="#fff8f0"/></svg>
          <div class="meta"><div class="iname">毛絨兔兔鞋</div><div class="price">65</div></div>
          <button class="btn-buy">購買</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
