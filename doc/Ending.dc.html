<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <style>
    body{margin:0;}
    .screen{
      width:1280px;height:800px;box-sizing:border-box;position:relative;overflow:hidden;
      font-family:'Quicksand',sans-serif;color:#5a4a42; display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .bg-victory{
      background:
        radial-gradient(circle at 50% 34%, rgba(255,217,61,0.35), rgba(255,182,193,0.12) 45%, transparent 65%),
        linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
      box-shadow: inset 0 0 0 12px #ffb6c1, inset 0 0 0 16px #ffffff;
    }
    .bg-abandon{
      background:
        radial-gradient(circle at 50% 34%, rgba(184,226,242,0.35), transparent 60%),
        linear-gradient(135deg, #eef4f8 0%, #e4ecf2 100%);
      box-shadow: inset 0 0 0 12px #c3d2e0, inset 0 0 0 16px #ffffff;
    }
    .deco{ position:absolute; }
    .stage-row{ display:flex; align-items:flex-end; gap:12px; }
    .stage{ width:280px; height:400px; }
    .side{ width:120px; height:170px; margin-bottom:6px; }
    .title-v{ font-weight:700; font-size:44px; color:#ff69b4; text-shadow:0 2px 0 rgba(255,255,255,0.8); margin-top:8px; }
    .title-a{ font-weight:700; font-size:38px; color:#7b93a8; margin-top:8px; }
    .sub-v{ font-size:15px; color:#9370db; margin-top:6px; font-weight:600; }
    .sub-a{ font-size:15px; color:#8496a8; margin-top:8px; text-align:center; line-height:1.7; }
    .stats{ display:flex; gap:18px; margin-top:20px; }
    .stat{
      background:rgba(255,255,255,0.85); border:3px dashed #ffb6c1; border-radius:16px; padding:12px 22px; text-align:center;
    }
    .stat .v{ font-size:22px; font-weight:700; color:#ff69b4; }
    .stat .l{ font-size:12px; color:#9370db; margin-top:4px; font-weight:600; }
    .btn{
      font-weight:700; letter-spacing:0.5px; border:none; cursor:pointer;
      border-radius:22px; padding:15px 40px; font-size:18px; margin-top:24px; color:#ffffff;
    }
    .btn-primary{ background:linear-gradient(180deg,#ffb6c1,#ff69b4); box-shadow:0 6px 0 #db7093, 0 8px 14px rgba(255,105,180,0.3); }
    .btn-muted{ background:linear-gradient(180deg,#b9c8d6,#93a7b8); box-shadow:0 6px 0 #74879a, 0 8px 14px rgba(147,167,184,0.3); }
  </style>
</helmet>

<sc-if value="{{isVictory}}" hint-placeholder-val="true">
<div class="screen bg-victory">
  <svg class="deco" style="top:34px;left:70px;" width="64" height="64" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="13" fill="#ffd93d"/>
    <g stroke="#ffd93d" stroke-width="4" stroke-linecap="round">
      <line x1="28" y1="2" x2="28" y2="10"/><line x1="28" y1="46" x2="28" y2="54"/>
      <line x1="2" y1="28" x2="10" y2="28"/><line x1="46" y1="28" x2="54" y2="28"/>
      <line x1="9" y1="9" x2="14" y2="14"/><line x1="42" y1="42" x2="47" y2="47"/>
      <line x1="47" y1="9" x2="42" y2="14"/><line x1="14" y1="42" x2="9" y2="47"/>
    </g>
    <circle cx="24" cy="26" r="1.6" fill="#8a5a4a"/><circle cx="32" cy="26" r="1.6" fill="#8a5a4a"/>
    <path d="M 23 31 Q 28 35 33 31" fill="none" stroke="#8a5a4a" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <svg class="deco" style="top:60px;right:90px;" width="30" height="28" viewBox="0 0 30 28"><path d="M15 26 C2 17 2 6 10 4 C13 3 15 6 15 8 C15 6 17 3 20 4 C28 6 28 17 15 26 Z" fill="#ff9eb5"/></svg>
  <svg class="deco" style="bottom:120px;left:140px;" width="26" height="26" viewBox="0 0 36 36"><circle cx="18" cy="10" r="7" fill="#ffb6c1"/><circle cx="10" cy="18" r="7" fill="#ffb6c1"/><circle cx="26" cy="18" r="7" fill="#ffb6c1"/><circle cx="14" cy="25" r="7" fill="#ffb6c1"/><circle cx="22" cy="25" r="7" fill="#ffb6c1"/><circle cx="18" cy="18" r="6" fill="#ffd93d"/></svg>
  <svg class="deco" style="bottom:100px;right:150px;" width="26" height="26" viewBox="0 0 36 36"><circle cx="18" cy="10" r="7" fill="#8fbfe0"/><circle cx="10" cy="18" r="7" fill="#8fbfe0"/><circle cx="26" cy="18" r="7" fill="#8fbfe0"/><circle cx="14" cy="25" r="7" fill="#8fbfe0"/><circle cx="22" cy="25" r="7" fill="#8fbfe0"/><circle cx="18" cy="18" r="6" fill="#ffd93d"/></svg>

  <div class="stage-row">
    <div class="side"><dc-import name="Character" base="rabbit" state="dressed" mood="happy" hint-size="120,170"></dc-import></div>
    <div class="stage"><dc-import name="Character" base="girl" state="dressed" mood="happy" hint-size="280,400"></dc-import></div>
    <div class="side"><dc-import name="Character" base="bear" state="dressed" mood="happy" hint-size="120,170"></dc-import></div>
  </div>
  <div class="title-v">九九乘法小達人誕生！</div>
  <div class="sub-v">恭喜你和小兔、小熊一起完成全部六個關卡</div>
  <div class="stats">
    <div class="stat"><div class="v">92%</div><div class="l">總正確率</div></div>
    <div class="stat"><div class="v">18 分</div><div class="l">總遊戲時間</div></div>
    <div class="stat"><div class="v">315</div><div class="l">草莓金幣</div></div>
  </div>
  <button class="btn btn-primary">再玩一次</button>
</div>
</sc-if>

<sc-if value="{{isAbandon}}" hint-placeholder-val="true">
<div class="screen bg-abandon">
  <svg class="deco" style="top:70px;left:50%;transform:translateX(-50%);" width="70" height="60" viewBox="0 0 60 52">
    <ellipse cx="30" cy="24" rx="29" ry="13" fill="#dbe9f4"/><circle cx="16" cy="16" r="14" fill="#dbe9f4"/><circle cx="36" cy="10" r="16" fill="#dbe9f4"/><circle cx="50" cy="18" r="12" fill="#dbe9f4"/>
    <line x1="18" y1="40" x2="15" y2="50" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="28" y2="52" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="40" x2="40" y2="50" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="stage"><dc-import name="Character" base="girl" state="shabby" mood="sad" hint-size="280,400"></dc-import></div>
  <div class="title-a">旅程未完待續...</div>
  <div class="sub-a">你在半路上放下了行囊<br/>小熊在原地等你，隨時歡迎你回來繼續冒險！</div>
  <button class="btn btn-muted">重新開始</button>
</div>
</sc-if>

<script data-dc-script data-props='{"ending":{"editor":"enum","default":"全破關","options":["全破關","中途放棄"],"section":"示範狀態"}}'>
class Component extends DCLogic {
  renderVals() {
    const ending = this.props.ending || '全破關';
    return { isVictory: ending === '全破關', isAbandon: ending === '中途放棄' };
  }
}
</script>
</x-dc>
</body>
</html>
