<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <style>
    body{margin:0;}
    .screen{
      width:1280px;height:800px;box-sizing:border-box;position:relative;overflow:hidden;
      font-family:'Quicksand',sans-serif;color:#5a4a42;
      background:
        linear-gradient(90deg, rgba(255,182,193,0.16) 50%, transparent 50%),
        linear-gradient(0deg, rgba(255,182,193,0.16) 50%, transparent 50%),
        linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
      background-size: 40px 40px;
      box-shadow: inset 0 0 0 12px #ffb6c1, inset 0 0 0 16px #ffffff;
    }
    .topbar{
      position:absolute; top:16px; left:16px; right:16px; height:70px; display:flex; align-items:center;
      justify-content:space-between; padding:0 26px; box-sizing:border-box;
      background:rgba(255,255,255,0.85); border:3px dashed #ffb6c1; border-radius:24px;
    }
    .level-name{ font-weight:700; font-size:17px; color:#ff69b4; }
    .counter{ font-weight:700; font-size:17px; color:#e05a7a; }
    .gold{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:15px; color:#e05a7a; }
    .right-group{ display:flex; align-items:center; gap:20px; }
    .avatar-mini{ width:38px; height:52px; }
    .dots{ position:absolute; top:96px; left:0; right:0; display:flex; justify-content:center; gap:8px; }
    .heart{ width:15px; height:15px; }
    .body-row{ position:absolute; top:130px; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:70px; padding-top:16px; }
    .left-col{ display:flex; flex-direction:column; align-items:center; gap:18px; width:340px; }
    .timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
    .timer-badge{ font-weight:700; font-size:13px; color:#9370db; background:#ffffff; border:2px solid #ffb6c1; border-radius:16px; padding:6px 18px; display:flex; align-items:center; gap:6px; }
    .qcard{
      width:320px; background:rgba(255,255,255,0.94); border:3px dashed #ffb6c1; border-radius:24px;
      box-shadow:0 12px 24px rgba(255,182,193,0.35);
      padding:28px 20px; box-sizing:border-box; text-align:center;
    }
    .qlabel{ font-weight:700; font-size:15px; color:#9370db; letter-spacing:1px; margin-bottom:12px; }
    .equation{ font-weight:700; font-size:44px; color:#ff69b4; }
    .readout{
      width:320px; background:#fff5f8; border:3px solid #ffb6c1; border-radius:16px; padding:12px;
      box-sizing:border-box; text-align:center; font-weight:700; font-size:32px;
      color:#e05a7a; letter-spacing:8px;
    }
    .keypad{ display:grid; grid-template-columns:repeat(3, 90px); gap:14px; }
    .key{
      height:74px; border-radius:18px; border:none; cursor:pointer;
      font-weight:700; font-size:24px; color:#ffffff;
      background:linear-gradient(180deg,#ffb6c1,#ff8fab);
      box-shadow: 0 5px 0 #e0648a, 0 8px 12px rgba(255,143,171,0.3);
    }
    .key-clear{ background:linear-gradient(180deg,#ffb0a8,#ff7a6e); box-shadow:0 5px 0 #d85a4e, 0 8px 12px rgba(255,122,110,0.3); font-size:15px; }
    .key-submit{ background:linear-gradient(180deg,#8fe0b8,#4fb286); box-shadow:0 5px 0 #3a8c68, 0 8px 12px rgba(79,178,134,0.3); font-size:15px; }
  </style>
</helmet>
<div class="screen">
  <div class="topbar">
    <div class="level-name">第三關 · 心算奇兵（輸入題）</div>
    <div class="counter">第 7 / 10 題</div>
    <div class="right-group">
      <div class="gold">
        <svg width="18" height="18" viewBox="0 0 30 30"><path d="M15 27 C4 19 4 8 12 5 C14.5 4 15 7 15 9 C15 7 15.5 4 18 5 C26 8 26 19 15 27 Z" fill="#ff5c7a"/></svg>
        120
      </div>
      <div class="avatar-mini"><dc-import name="Character" base="girl" state="dressed" mood="happy" hint-size="38,52"></dc-import></div>
    </div>
  </div>

  <div class="dots">
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ff69b4"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="#ffd93d"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="none" stroke="#ffc7d3" stroke-width="1.6"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="none" stroke="#ffc7d3" stroke-width="1.6"/></svg>
    <svg class="heart" viewBox="0 0 20 20"><path d="M10 18 C2 12 2 4 7 3 C9 2.5 10 5 10 6 C10 5 11 2.5 13 3 C18 4 18 12 10 18 Z" fill="none" stroke="#ffc7d3" stroke-width="1.6"/></svg>
  </div>

  <div class="body-row">
    <div class="left-col">
      <sc-if value="{{timed}}" hint-placeholder-val="true">
        <div class="timer-wrap">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle cx="38" cy="38" r="32" fill="#ffffff" stroke="#ffe1ea" stroke-width="8"/>
            <circle cx="38" cy="38" r="32" fill="none" stroke="#ff9eb5" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="201" stroke-dashoffset="50" transform="rotate(-90 38 38)"/>
            <text x="38" y="44" text-anchor="middle" font-family="Quicksand, sans-serif" font-weight="700" font-size="22" fill="#ff69b4">15</text>
          </svg>
        </div>
      </sc-if>
      <sc-if value="{{untimed}}" hint-placeholder-val="true">
        <div class="timer-wrap">
          <div class="timer-badge">
            <svg width="18" height="12" viewBox="0 0 60 36"><ellipse cx="30" cy="24" rx="29" ry="11" fill="#eaf6ff"/><circle cx="16" cy="16" r="13" fill="#eaf6ff"/><circle cx="36" cy="10" r="15" fill="#eaf6ff"/><circle cx="50" cy="17" r="11" fill="#eaf6ff"/></svg>
            不限時，慢慢想
          </div>
        </div>
      </sc-if>
      <div class="qcard">
        <div class="qlabel">算算看，答案是？</div>
        <div class="equation">6 × 9 = ?</div>
      </div>
      <div class="readout">5 4</div>
    </div>

    <div class="keypad">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key key-clear">清除</button><button class="key">0</button><button class="key key-submit">送出</button>
    </div>
  </div>
</div>
<script data-dc-script data-props='{"timed":{"editor":"boolean","default":true,"section":"示範狀態"}}'>
class Component extends DCLogic {
  renderVals() {
    const timed = !!this.props.timed;
    return { timed, untimed: !timed };
  }
}
</script>
</x-dc>
</body>
</html>
