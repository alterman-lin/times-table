<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
  <style>
    body{margin:0;}
    .screen{
      width:1280px;height:800px;box-sizing:border-box;position:relative;overflow:hidden;
      font-family:'Quicksand',sans-serif;color:#5a4a42; display:flex; align-items:center; justify-content:center;
    }
    .bg-pass{
      background:
        radial-gradient(ellipse at 50% 25%, rgba(255,217,61,0.28), transparent 60%),
        linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
      box-shadow: inset 0 0 0 12px #ffb6c1, inset 0 0 0 16px #ffffff;
    }
    .bg-fail{
      background:
        radial-gradient(ellipse at 50% 25%, rgba(184,226,242,0.4), transparent 60%),
        linear-gradient(135deg, #eef4f8 0%, #e4ecf2 100%);
      box-shadow: inset 0 0 0 12px #c3d2e0, inset 0 0 0 16px #ffffff;
    }
    .deco{ position:absolute; }
    .panel{ display:flex; align-items:center; gap:56px; }
    .stage{ width:260px; height:380px; position:relative; }
    .info{ width:460px; display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
    .banner-pass{ font-weight:700; font-size:42px; color:#ff69b4; text-shadow:0 2px 0 rgba(255,255,255,0.8); }
    .banner-fail{ font-weight:700; font-size:40px; color:#7b93a8; }
    .sub{ font-size:15px; color:#9370db; font-weight:600; }
    .score-card{
      width:100%; box-sizing:border-box; padding:16px 22px; border-radius:16px; border:3px dashed #ffb6c1;
      background:rgba(255,255,255,0.85); font-size:18px; font-weight:700; color:#5a4a42;
    }
    .score-card.fail{ border-color:#c3d2e0; }
    .reward{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:24px; color:#e05a7a; }
    .comfort{ font-size:15px; color:#7b93a8; line-height:1.7; background:rgba(255,255,255,0.7); border-radius:14px; padding:14px 18px; }
    .btn-row{ display:flex; gap:18px; margin-top:6px; }
    .btn{
      font-weight:700; letter-spacing:0.5px; border:none; cursor:pointer;
      border-radius:20px; padding:15px 28px; font-size:16px; color:#ffffff;
    }
    .btn-primary{ background:linear-gradient(180deg,#ffb6c1,#ff69b4); box-shadow:0 6px 0 #db7093, 0 8px 14px rgba(255,105,180,0.3); }
    .btn-secondary{ background:linear-gradient(180deg,#8fe0b8,#4fb286); box-shadow:0 6px 0 #3a8c68, 0 8px 14px rgba(79,178,134,0.3); }
    .btn-muted{ background:linear-gradient(180deg,#b9c8d6,#93a7b8); box-shadow:0 6px 0 #74879a, 0 8px 14px rgba(147,167,184,0.3); }
  </style>
</helmet>

<sc-if value="{{isPass}}" hint-placeholder-val="true">
<div class="screen bg-pass">
  <svg class="deco" style="top:40px;left:60px;" width="64" height="64" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="13" fill="#ffd93d"/>
    <g stroke="#ffd93d" stroke-width="4" stroke-linecap="round">
      <line x1="28" y1="2" x2="28" y2="10"/><line x1="28" y1="46" x2="28" y2="54"/>
      <line x1="2" y1="28" x2="10" y2="28"/><line x1="46" y1="28" x2="54" y2="28"/>
      <line x1="9" y1="9" x2="14" y2="14"/><line x1="42" y1="42" x2="47" y2="47"/>
      <line x1="47" y1="9" x2="42" y2="14"/><line x1="14" y1="42" x2="9" y2="47"/>
    </g>
    <circle cx="24" cy="26" r="1.6" fill="#8a5a4a"/><circle cx="32" cy="26" r="1.6" fill="#8a5a4a"/>
    <path d="M 23 31 Q 28 35 33 31" fill="none" stroke="#8a5a4a" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <svg class="deco" style="top:70px;right:80px;" width="30" height="28" viewBox="0 0 30 28"><path d="M15 26 C2 17 2 6 10 4 C13 3 15 6 15 8 C15 6 17 3 20 4 C28 6 28 17 15 26 Z" fill="#ff9eb5"/></svg>
  <svg class="deco" style="bottom:90px;left:120px;" width="26" height="26" viewBox="0 0 36 36"><circle cx="18" cy="10" r="7" fill="#ffb6c1"/><circle cx="10" cy="18" r="7" fill="#ffb6c1"/><circle cx="26" cy="18" r="7" fill="#ffb6c1"/><circle cx="14" cy="25" r="7" fill="#ffb6c1"/><circle cx="22" cy="25" r="7" fill="#ffb6c1"/><circle cx="18" cy="18" r="6" fill="#ffd93d"/></svg>
  <svg class="deco" style="bottom:60px;right:100px;" width="26" height="26" viewBox="0 0 36 36"><circle cx="18" cy="10" r="7" fill="#8fe0b8"/><circle cx="10" cy="18" r="7" fill="#8fe0b8"/><circle cx="26" cy="18" r="7" fill="#8fe0b8"/><circle cx="14" cy="25" r="7" fill="#8fe0b8"/><circle cx="22" cy="25" r="7" fill="#8fe0b8"/><circle cx="18" cy="18" r="6" fill="#ffd93d"/></svg>

  <div class="panel">
    <div class="stage"><dc-import name="Character" base="girl" state="dressed" mood="happy" hint-size="260,380"></dc-import></div>
    <div class="info">
      <div class="banner-pass">恭喜過關！</div>
      <div class="sub">第一關 · 新手試煉（是非題）</div>
      <div class="score-card">10 題答對 8 題　已達過關標準（7 題以上）</div>
      <div class="reward">
        <svg width="24" height="24" viewBox="0 0 30 30"><path d="M15 27 C4 19 4 8 12 5 C14.5 4 15 7 15 9 C15 7 15.5 4 18 5 C26 8 26 19 15 27 Z" fill="#ff5c7a"/></svg>
        獲得 45 顆草莓金幣
      </div>
      <div class="btn-row">
        <button class="btn btn-primary">前往商店</button>
        <button class="btn btn-secondary">下一關 →</button>
      </div>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{isFail}}" hint-placeholder-val="true">
<div class="screen bg-fail">
  <svg class="deco" style="top:60px;left:90px;" width="60" height="52" viewBox="0 0 60 52">
    <ellipse cx="30" cy="24" rx="29" ry="13" fill="#dbe9f4"/><circle cx="16" cy="16" r="14" fill="#dbe9f4"/><circle cx="36" cy="10" r="16" fill="#dbe9f4"/><circle cx="50" cy="18" r="12" fill="#dbe9f4"/>
    <line x1="18" y1="40" x2="15" y2="50" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="28" y2="52" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="40" x2="40" y2="50" stroke="#a9c6dc" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="panel">
    <div class="stage"><dc-import name="Character" base="girl" state="dressed" mood="sad" hint-size="260,380"></dc-import></div>
    <div class="info">
      <div class="banner-fail">再試一次吧！</div>
      <div class="sub">第一關 · 新手試煉（是非題）</div>
      <div class="score-card fail">10 題答對 5 題　未達過關標準（需 7 題以上）</div>
      <div class="comfort">小熊拿出手帕溫柔地說：「沒關係，再試一次一定行！」</div>
      <div class="btn-row">
        <button class="btn btn-primary">重新挑戰本關</button>
        <button class="btn btn-muted">結束本局</button>
      </div>
    </div>
  </div>
</div>
</sc-if>

<script data-dc-script data-props='{"result":{"editor":"enum","default":"過關","options":["過關","失敗"],"section":"示範狀態"}}'>
class Component extends DCLogic {
  renderVals() {
    const result = this.props.result || '過關';
    return { isPass: result === '過關', isFail: result === '失敗' };
  }
}
</script>
</x-dc>
</body>
</html>
